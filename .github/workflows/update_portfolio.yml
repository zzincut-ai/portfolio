name: Update Portfolio Video Database

on:
  push:
    paths:
      - 'assets/videos/**'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install hachoir

      - name: Run script
        run: python scripts/generate_portfolio.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/videos.json app.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update portfolio video database [skip ci]" && git push)
